name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── CI: Shell Script Lint ──────────────────────────────────────────────────
  # 오류 발생 실제 동작과 무관하여 lint 단계는 일단 보류
  # lint:
  #   name: Lint shell scripts
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: shellcheck
  #       uses: ludeeus/action-shellcheck@master
  #       with:
  #         scandir: ./scripts
  #         additional_files: docker/entrypoint.sh

  # ── CI: Docker 빌드 검증 (표준) ────────────────────────────────────────────
  build-docker:
    name: Build Docker (standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (standard)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── CI: Docker 빌드 검증 (Go 확장) ────────────────────────────────────────
  build-extend:
    name: Build Docker (extend / Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (extend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.extend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── CD: 배포 (main push + CI 통과 시만) ────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # needs: [lint, build-docker, build-extend]
    needs: [build-docker, build-extend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: 배포용 .env 생성 (GitHub Secrets/Variables)
        env:
          PB_VERSION: ${{ vars.PB_VERSION }}
          PB_HOST_PORT: ${{ vars.PB_HOST_PORT }}
          DOMAIN: ${{ vars.DOMAIN }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
          PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -eu

          required_vars="PB_VERSION PB_HOST_PORT DOMAIN PB_ADMIN_EMAIL PB_ADMIN_PASSWORD CF_TUNNEL_TOKEN BACKUP_RETENTION_DAYS"
          for key in $required_vars; do
            eval "value=\${$key:-}"
            if [ -z "$value" ]; then
              echo "[deploy] 누락된 Actions 값: $key"
              exit 1
            fi
          done

          # 한 줄씩 안전하게 파일에 추가하는 방식으로 변경 (줄바꿈/유령공백 에러 원천 차단)
          echo "# Generated by GitHub Actions deploy workflow" > .env
          echo "PB_VERSION=${PB_VERSION}" >> .env
          echo "PB_HOST_PORT=${PB_HOST_PORT}" >> .env
          echo "PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}" >> .env
          echo "PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}" >> .env
          echo "CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}" >> .env
          echo "DOMAIN=${DOMAIN}" >> .env
          echo "BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}" >> .env
          echo "BACKUP_S3_REGION=${BACKUP_S3_REGION}" >> .env
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> .env
          echo "BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS}" >> .env

      - name: SSH 키 설정
        run: |
          set -eu
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: 배포 실행
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FORCE_SYNC_ENV: "1"
        run: sh scripts/deploy.sh cloudflare
