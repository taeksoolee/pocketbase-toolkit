services:
  pocketbase:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PB_VERSION: ${PB_VERSION:-0.22.4}
    restart: unless-stopped
    ports:
      - "${PB_HOST_PORT:-8090}:8090"
    volumes:
      - pb_data:/pb/pb_data
      - ../pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pb_data:
