services:
  pocketbase:
    env_file: ../.env

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - default

networks:
  default:

volumes:
  caddy_data:
  caddy_config:
