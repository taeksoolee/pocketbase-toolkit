services:
  pocketbase:
    env_file: ../.env
    volumes:
      - ../scripts/backup.sh:/scripts/backup.sh:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - default

  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-exec.pb-backup.schedule: "0 2 * * *"
      ofelia.job-exec.pb-backup.container: "pocketbase"
      ofelia.job-exec.pb-backup.command: "sh /scripts/backup.sh"
    networks:
      - default

networks:
  default:
